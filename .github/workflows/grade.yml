name: Grade self-play for training


on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Kaggle dataset with the self-play positions
        default: markthegamer108/nexarch-g2-full
      datafile:
        description: file name inside the dataset
        default: nexarch-g2-full.bin
      seconds:
        description: grading time per job, in seconds
        default: "19500"

jobs:
  grade:
    name: grade shard ${{ matrix.shard }} part ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard: [0, 1, 2, 3]
        part: [0, 1, 2, 3]
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      DATASET: ${{ inputs.dataset }}
      DATAFILE: ${{ inputs.datafile }}
      GRADE_SECONDS: ${{ inputs.seconds }}
      OUT: grade-gh-${{ matrix.shard }}-${{ matrix.part }}.bin
    steps:
      - name: Start the clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install -q numpy chess kaggle six
      - name: Download engines and positions
        run: |
          fetch() {
            for i in $(seq 1 13); do
              if kaggle datasets download "$1" -p "$2" --unzip -o -q && [ -f "$3" ]; then return 0; fi
              echo "::warning::download of $1 failed (try $i/13), retrying in 5 minutes"
              sleep 300
            done
            echo "::error::could not download $1"
            return 1
          }
          fetch markthegamer108/nexarch-engines . engines/bin/stockfish
          chmod -R u+x engines/bin engines/real engines/lib
          fetch "$DATASET" data "data/$DATAFILE"
          ls engines/bin | wc -l; ls -la data
      - name: Grade
        run: |
          left=$(( 355 * 60 - ($(date +%s) - JOB_START) - 900 ))
          secs=$GRADE_SECONDS
          if [ "$left" -lt "$secs" ]; then secs=$left; fi
          if [ "$secs" -lt 60 ]; then echo "::error::no time left to grade"; exit 1; fi
          echo "grading for $secs seconds"
          python tools/grade.py --config nets/graders.json --data "data/$DATAFILE" --out "$OUT" --workers 4 \
            --shard ${{ matrix.shard }} --shards 4 --reverse --part ${{ matrix.part }} --parts 4 \
            --seconds "$secs" --flush-every 50
      - name: Report card
        run: python tools/report_card.py "$OUT.meta.npz"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: grade-gh-${{ matrix.shard }}-${{ matrix.part }}
          path: grade-gh-${{ matrix.shard }}-${{ matrix.part }}.bin*
          retention-days: 30
